<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bde8fb"/><stop offset=".58" stop-color="#eaf8fd"/><stop offset="1" stop-color="#fff8ec"/></linearGradient>
  <radialGradient id="sunGlow"><stop stop-color="#fff9c9" stop-opacity=".95"/><stop offset="1" stop-color="#fff9c9" stop-opacity="0"/></radialGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b6e78c"/><stop offset=".5" stop-color="#8fd06d"/><stop offset="1" stop-color="#6fbb5f"/></linearGradient>
  <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9c58c"/><stop offset="1" stop-color="#bd8b5f"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8ecfb"/><stop offset=".55" stop-color="#61c7e9"/><stop offset="1" stop-color="#3ba6d2"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3c17c"/><stop offset=".55" stop-color="#c9854e"/><stop offset="1" stop-color="#9a613d"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6fb65c"/><stop offset="1" stop-color="#3e8548"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff5d9"/><stop offset="1" stop-color="#d9c9a6"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#375c54" flood-opacity=".24"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="tinyshadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4e6744" flood-opacity=".28"/></filter>
  <pattern id="soil" width="42" height="32" patternUnits="userSpaceOnUse"><rect width="42" height="32" fill="#795035"/><circle cx="8" cy="8" r="2" fill="#a06b45"/><circle cx="28" cy="19" r="2.2" fill="#593b2a"/><path d="M16 27l5-2" stroke="#9a6846" stroke-width="2" stroke-linecap="round"/></pattern>
</defs>
