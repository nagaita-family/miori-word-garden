<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fbf7ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Garden">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260914-v4">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=20260914-v4">
  <link rel="manifest" href="manifest.webmanifest?v=20260914-v4">
  <title>Miori's Word Garden</title>
  <link rel="stylesheet" href="styles.css?v=20260914-pencil-box-v2">
  <link rel="stylesheet" href="spellgarden-theme-v4.css?v=20260914-spellgarden-v4">
  <link rel="stylesheet" href="pencil-touch-guard.css?v=20260914-palm-v4a">
  <link rel="stylesheet" href="final-polish-v1.css?v=20260914-final-v1a">
  <link rel="stylesheet" href="lesson-flow-v2.css?v=20260914-lesson-v2a">
  <link rel="stylesheet" href="garden-delight-v3.css?v=20260914-garden-v3a">
  <link rel="stylesheet" href="garden-admin-v4.css?v=20260914-v4">
  <link rel="stylesheet" href="california-backyard-v5.css?v=20260914-v5">
  <link rel="stylesheet" href="play-listen-v6.css?v=20260914-v6">
  <link rel="stylesheet" href="play-controls-v7.css?v=20260914-v7">
  <link rel="stylesheet" href="play-handwriting-audio-v8.css?v=20260915-v8">
  <link rel="stylesheet" href="stage3-trace-v9.css?v=20260915-v9">
  <link rel="stylesheet" href="garden-celebration-v10.css?v=20260915-v10">
  <link rel="stylesheet" href="garden-play-v11.css?v=20260915-v12">
  <link rel="stylesheet" href="version-badge-v15.css?v=20260915-v15">
  <link rel="stylesheet" href="treasure-unlock-v16.css?v=20260915-v16">
  <link rel="stylesheet" href="audio-progress-v17.css?v=20260915-v17">
  <link rel="stylesheet" href="garden-layout-v18.css?v=20260915-v18">
  <link rel="stylesheet" href="parent-guidance-v19.css?v=20260915-v19">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="garden" aria-label="Go to garden">
        <span class="brand-mark app-icon-mark"><img src="app-icon.svg?v=20260914-v4" alt=""></span>
        <span><strong>Miori's Word Garden</strong><small>spell · grow · collect ✦</small></span>
      </button>
      <div class="level-wrap" aria-label="Treasure progress">
        <div class="level-row"><span id="levelLabel">🎁 Next treasure</span><span id="xpLabel">0 / 3 words</span></div>
        <div class="xp-track"><div id="xpFill" class="xp-fill"></div></div>
      </div>
      <button id="musicToggle" class="music-toggle" aria-label="Mute music and sound effects" title="Music + sound effects on">♫</button>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-btn active" data-nav="garden">Garden</button>
        <button class="nav-btn play-nav" data-nav="play">Play</button>
        <button class="nav-btn" data-nav="parent">Parent</button>
        <span class="app-version-badge" aria-label="App version 20, September 16">v20 · Sep 16</span>
      </nav>
    </header>

    <main id="main">
      <section id="gardenView" class="view active-view"></section>
      <section id="playView" class="view"></section>
      <section id="parentView" class="view"></section>
    </main>
  </div>

  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js?v=20260916-placed-items-v20"></script>
  <script src="pencil-touch-guard.js?v=20260915-palm-v12"></script>
</body>
</html>
<!-- v20 production: Garden reactions only trigger from items actually placed in the garden -->
