function edit(w=null){let l=w?.learn||learning('');let e=document.createElement('aside');e.className='edit';e.innerHTML=`<div class="ehead"><h2>${w?'Edit “'+w.word+'”':'Add word'}</h2><button class="close">×</button></div><div class="form"><div class="field"><label>Word</label><input id="ew" value="${esc(w?.word||'')}" ${w?'readonly':''}></div><div class="field"><label>School English Meaning</label><textarea id="een">${esc(w?.meaningEn||'')}</textarea></div><div class="field"><label>Japanese meaning</label><input id="eja" value="${esc(w?.meaningJa||'')}"></div><div class="field"><label>Example sentence</label><textarea id="eex">${esc(w?.example||'')}</textarea></div><div class="field"><label>Phonics focus</label><input id="eph" value="${esc(w?.phonicsFocus||'')}"></div><div class="field"><label>Picture cue</label><input id="epic" value="${esc(w?.pictureCue||'')}"></div><div class="field"><label>Miori's spelling — highest adaptive priority</label><input id="em" value="${esc(w?.mioriSpelling||'')}" placeholder="e.g. responsibol"></div>${w?`<div class="stats"><div class="stat"><b>${l.stageMist[4]||0}</b><span>Stage 4 mistakes</span></div><div class="stat"><b>${weak(w)||'—'}</b><span>Weak part</span></div><div class="stat"><b>${l.hints}</b><span>Hints used</span></div><div class="stat"><b>${l.correct?Math.round(l.first/l.correct*100):0}%</b><span>First try</span></div></div>`:''}</div><button class="save">${w?'Save changes':'Add to This Week'}</button>${w?'<button class="reset">Reset learning for this word</button>':''}`;document.body.appendChild(e);$('.close',e).onclick=()=>e.remove();$('.save',e).onclick=()=>{let word=norm($('#ew',e).value);if(!word)return toast('Enter a word.');let old=S.lib[word],obj={id:word,word,meaningEn:$('#een',e).value.trim(),meaningJa:$('#eja',e).value.trim(),example:$('#eex',e).value.trim(),phonicsFocus:norm($('#eph',e).value),pictureCue:$('#epic',e).value.trim(),mioriSpelling:norm($('#em',e).value),confusions:old?.confusions||[],learn:old?.learn||learning(word)};while(obj.learn.weak.length<word.length)obj.learn.weak.push(0);S.lib[word]=obj;if(!S.week.ids.includes(word))S.week.ids.push(word);save();e.remove();parent();toast('Saved.')};$('.reset',e)?.addEventListener('click',()=>{if(confirm('Reset learning for this word only?')){w.learn=learning(w.word);save();e.remove();parent()}})}
$('#importFile').onchange=async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{let p=JSON.parse(await f.text());if(p.version===2&&p.lib){S=p;save();parent();toast('Backup restored.')}else if(Array.isArray(p.words)){applyPack(S,p);S=load();parent();toast('Word Pack imported.')}else throw 0}catch{toast('That JSON is not a Word Pack or backup.')}};
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='miori-word-garden-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
render('garden');
</script></body></html>
