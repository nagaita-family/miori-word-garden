<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f8f2ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Miori's Word Garden</title>
  <link rel="stylesheet" href="styles.css?v=20260914-pencil-box-v1">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="garden" aria-label="Go to garden">
        <span class="brand-mark">✿</span>
        <span><strong>Word Garden</strong><small>Miori's little spelling world</small></span>
      </button>
      <div class="level-wrap" aria-label="Level progress">
        <div class="level-row"><span id="levelLabel">Level 1</span><span id="xpLabel">0 / 100 XP</span></div>
        <div class="xp-track"><div id="xpFill" class="xp-fill"></div></div>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-btn active" data-nav="garden">Garden</button>
        <button class="nav-btn play-nav" data-nav="play">Play</button>
        <button class="nav-btn" data-nav="parent">Parent</button>
      </nav>
    </header>

    <main id="main">
      <section id="gardenView" class="view active-view"></section>
      <section id="playView" class="view"></section>
      <section id="parentView" class="view"></section>
    </main>
  </div>

  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js?v=20260914-pencil-box-v1"></script>
</body>
</html>
