name: Play flowing handwriting v29

on:
  push:
    paths:
      - '.github/workflows/play-flow-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate Garden-only BGM and flowing Play inputs
        run: python3 tools/play-flow-v29-patch.py
      - name: Confirm Stage 4 test uses realistic 1-to-l recognition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/play-flow-v29.test.cjs')
          text=p.read_text(encoding='utf-8')
          old="fields['#stage4WordInput'].value='ladyb1g';"
          assert text.count(old)==1
          p.write_text(text.replace(old,"fields['#stage4WordInput'].value='1adybug';",1),encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check weekly-result-compare-v26.js
          node --check weekly-test-palm-v25.js
      - name: Old features plus v29 regression tests
        run: |
          node tests/parent-priority-v22.test.cjs
          node tests/weekly-test-v23.test.cjs
          node tests/weekly-test-v24.test.cjs
          node tests/weekly-test-v25.test.cjs
          node tests/weekly-result-v26.test.cjs
          node tests/weekly-listen-v27.test.cjs
          node tests/weekly-lowercase-v28.test.cjs
          node tests/play-flow-v29.test.cjs
      - name: Commit verified app and regression updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/weekly-test-v24.test.cjs tests/weekly-test-v25.test.cjs tests/weekly-lowercase-v28.test.cjs tests/play-flow-v29.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Keep BGM in Garden and speed up fluent Stage 3 and 4 Pencil writing (v29)"
          git push
