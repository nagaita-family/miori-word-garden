name: Parent word auto-fill v34
on:
  push:
    paths:
      - '.github/workflows/auto-fill-v34.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate v34 without changing play, Garden, or saved learning history
        run: python3 tools/auto-fill-v34-patch.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check word-auto-fill-v34.js
          node --check tests/word-auto-fill-v34.test.cjs
      # The dictionary does not have a phonics clue for every word; a blank is intentional.
      - name: Full regression suite including offline dictionary mocks
        run: node --test tests/*.test.cjs
      - name: Publish only after all tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/*.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Auto-fill My Words and add protected batch fill for school tests (v34)"
          git push
