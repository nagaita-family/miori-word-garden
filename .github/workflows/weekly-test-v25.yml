name: Weekly test palm and review v25

on:
  push:
    paths:
      - '.github/workflows/weekly-test-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused v25 changes
        run: python3 tools/weekly-test-v25-patch.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check weekly-test-palm-v25.js
      - name: Test v22-v24 regressions and v25 behavior
        run: |
          node tests/parent-priority-v22.test.cjs
          node tests/weekly-test-v23.test.cjs
          node tests/weekly-test-v24.test.cjs
          node tests/weekly-test-v25.test.cjs
      - name: Commit only verified code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/weekly-test-v24.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Guard weekly test from palm taps and review misses in stages 3-4"
          git push
