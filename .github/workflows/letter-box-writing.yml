name: Letter-box handwriting for Stages 3 and 4

on:
  push:
    paths:
      - '.github/workflows/letter-box-writing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Stage 3 and 4 redesign
        run: python .github/patches/apply-letter-boxes.py
      - name: Validate JavaScript
        run: |
          python -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script>(.*)</script>',s,re.S); assert m; pathlib.Path('/tmp/app.js').write_text(m.group(1))"
          node --check /tmp/app.js
          grep -q 'LETTER_BOX_WRITING_V3_20260913' index.html
          grep -q 'Write across the boxes' index.html
          grep -q 'function alignChars' index.html
          grep -q 'function openInlineHint' index.html
      - name: Commit Stage 3 and 4 redesign
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Redesign Stage 3 and 4 with letter boxes"
          git push
