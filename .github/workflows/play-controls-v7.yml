name: Play controls v7

on:
  push:
    paths:
      - '.github/workflows/play-controls-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Play control polish
        run: python3 tools/play_controls_v7_patch.py

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Improve Play word audio and assistance controls"
          git push
