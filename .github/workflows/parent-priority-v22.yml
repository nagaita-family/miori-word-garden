name: Parent-selected practice v22

on:
  push:
    paths:
      - '.github/workflows/parent-priority-v22.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply parent priority patch
        run: python3 tools/parent-priority-v22.py
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Run normal and Test Mode regression tests
        run: node tests/parent-priority-v22.test.cjs
      - name: Commit tested app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Prioritize parent-starred practice words in Play"
          git push
