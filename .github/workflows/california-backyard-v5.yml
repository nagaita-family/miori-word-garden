name: California backyard v5

on:
  push:
    paths:
      - '.github/workflows/california-backyard-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply California backyard app patch
        run: python3 tools/california_patch.py

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit production app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add California backyard rewards and interactions"
          git push
