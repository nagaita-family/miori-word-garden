name: California backyard v5

on:
  push:
    paths:
      - '.github/workflows/california-backyard-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply sunny California backyard redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()

          old_rewards="""const rewards=[
{id:'bunny',xp:0,type:'rabbit',label:'Bunny',icon:'🐰',x:51,y:64},
{id:'bench',xp:70,type:'treasure',label:'Cozy heart bench',icon:'🩷',x:25,y:72},
{id:'picnic',xp:140,type:'treasure',label:'Strawberry picnic',icon:'🍓',x:78,y:70},
{id:'mail',xp:220,type:'treasure',label:'Heart mailbox',icon:'💌',x:17,y:55},
{id:'cat',xp:310,type:'friend',label:'Garden cat',icon:'🐱',x:69,y:62}
];"""
          new_rewards="""const rewards=[
{id:'bunny',xp:0,type:'rabbit',label:'Bunny',icon:'🐰',x:50,y:66},
{id:'bench',xp:70,type:'treasure',label:'White garden bench',icon:'🤍',x:25,y:73},
{id:'picnic',xp:140,type:'treasure',label:'Strawberry picnic',icon:'🍓',x:78,y:72},
{id:'mail',xp:220,type:'treasure',label:'Heart mailbox',icon:'💌',x:17,y:57},
{id:'cat',xp:310,type:'friend',label:'Garden cat',icon:'🐱',x:69,y:64},
{id:'birdbath',xp:400,type:'treasure',label:'Bird bath',icon:'🐦',x:85,y:51},
{id:'seedcrate',xp:500,type:'treasure',label:'Seed crate',icon:'🌼',x:34,y:61},
{id:'arch',xp:620,type:'treasure',label:'Flower arch',icon:'🌸',x:57,y:51},
{id:'shed',xp:760,type:'treasure',label:'Little garden shed',icon:'🏡',x:90,y:34}
];"""
          if old_rewards not in s: raise SystemExit('rewards block not found')
          s=s.replace(old_rewards,new_rewards,1)

          marker="function gardenObjectArt(r){"
          art=r'''function caBenchSvg(){return`<svg viewBox="0 0 140 100" aria-hidden="true"><rect x="17" y="48" width="106" height="16" rx="8" fill="#f7f3e9" stroke="#d9d0c0" stroke-width="3"/><rect x="22" y="21" width="96" height="31" rx="13" fill="#fffdf7" stroke="#d9d0c0" stroke-width="3"/><path d="M70 29c-7-8-18-1-13 7 4 6 13 11 13 11s9-5 13-11c5-8-6-15-13-7z" fill="#f38e86"/><rect x="29" y="62" width="9" height="29" rx="4" fill="#b7926b"/><rect x="103" y="62" width="9" height="29" rx="4" fill="#b7926b"/></svg>`}
function caPicnicSvg(){return`<svg viewBox="0 0 140 108" aria-hidden="true"><path d="M10 63h120l-14 35H24z" fill="#f7f2e8"/><path d="M10 63h120M24 63l14 35M48 63l8 35M73 63l-3 35M98 63l-12 35M122 63l-20 35" stroke="#ef827d" stroke-width="5" opacity=".82"/><rect x="43" y="36" width="55" height="40" rx="10" fill="#c38d5c"/><path d="M51 40q16-29 39 0" fill="none" stroke="#9a6b45" stroke-width="6" stroke-linecap="round"/><circle cx="51" cy="34" r="8" fill="#e84f5e"/><circle cx="67" cy="30" r="8" fill="#f0636a"/><circle cx="84" cy="35" r="8" fill="#e64b58"/><path d="M48 26l4 7 4-7M64 22l4 7 4-7M81 27l4 7 4-7" stroke="#4c9a61" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`}
function caMailboxSvg(){return`<svg viewBox="0 0 122 128" aria-hidden="true"><rect x="54" y="70" width="13" height="49" rx="5" fill="#b0835f"/><path d="M27 34q0-22 25-22h24q25 0 25 22v43H27z" fill="#fffaf0" stroke="#d6cec0" stroke-width="4"/><path d="M27 39h74" stroke="#e2d9cb" stroke-width="4"/><rect x="39" y="45" width="49" height="23" rx="7" fill="#f38e86"/><path d="M40 46l24 15 24-15" fill="none" stroke="#fff5ed" stroke-width="4"/><path d="M96 18v30" stroke="#9d7460" stroke-width="5" stroke-linecap="round"/><path d="M96 18h15l-5 10 5 10H96" fill="#f5c94a"/></svg>`}
function caCatSvg(){return`<svg viewBox="0 0 125 145" aria-hidden="true"><path d="M92 108q29-5 18-35" fill="none" stroke="#85898d" stroke-width="12" stroke-linecap="round"/><ellipse cx="64" cy="106" rx="38" ry="31" fill="#aeb2b4"/><path d="M34 48l5-28 22 17M91 48l-5-28-22 17" fill="#9ca0a3"/><circle cx="63" cy="61" r="40" fill="#b8bcbe"/><path d="M41 58h10M76 58h10" stroke="#3f4043" stroke-width="5" stroke-linecap="round"/><path d="M58 70l5 4 5-4" fill="none" stroke="#8f666c" stroke-width="4" stroke-linecap="round"/><path d="M45 87q18 13 37 0" fill="none" stroke="#94989a" stroke-width="5" stroke-linecap="round"/><path d="M28 44q15 12 31 3M97 44q-15 12-31 3" stroke="#fff9f1" stroke-width="6" opacity=".9"/></svg>`}
function birdBathSvg(){return`<svg viewBox="0 0 130 135" aria-hidden="true"><ellipse cx="65" cy="40" rx="48" ry="14" fill="#d7e3e5" stroke="#aabfc4" stroke-width="4"/><path d="M22 39q43 28 86 0" fill="#b9d7dc"/><rect x="58" y="48" width="14" height="58" rx="7" fill="#d8ddcf"/><ellipse cx="65" cy="112" rx="34" ry="10" fill="#c9cfbf"/><path d="M78 27q11-12 25-2-8 3-12 11-5-1-13-9z" fill="#5f8fb5"/><circle cx="98" cy="25" r="2.5" fill="#34363b"/><path d="M105 25l10 3-10 3z" fill="#e8a73d"/></svg>`}
function seedCrateSvg(){return`<svg viewBox="0 0 140 112" aria-hidden="true"><rect x="20" y="48" width="100" height="49" rx="8" fill="#c48b58" stroke="#9d6f47" stroke-width="4"/><path d="M27 61h86M27 79h86" stroke="#e5bb8f" stroke-width="5"/><rect x="35" y="29" width="26" height="36" rx="4" fill="#f7e7b7" transform="rotate(-8 48 47)"/><rect x="72" y="24" width="28" height="39" rx="4" fill="#dfe9c9" transform="rotate(8 86 44)"/><circle cx="48" cy="44" r="7" fill="#ef8a7e"/><path d="M86 35v17M78 44h16" stroke="#6e9b62" stroke-width="4" stroke-linecap="round"/><path d="M112 34l7-13M110 37l15-4" stroke="#8a6b54" stroke-width="5" stroke-linecap="round"/></svg>`}
function flowerArchSvg(){return`<svg viewBox="0 0 145 150" aria-hidden="true"><path d="M28 137V68q0-50 45-50t45 50v69" fill="none" stroke="#eef0e7" stroke-width="12" stroke-linecap="round"/><path d="M38 137V70q0-38 35-38t35 38v67" fill="none" stroke="#8daf7c" stroke-width="8" stroke-linecap="round"/><g fill="#ef8e91"><circle cx="39" cy="54" r="10"/><circle cx="57" cy="31" r="10"/><circle cx="84" cy="28" r="10"/><circle cx="106" cy="48" r="10"/></g><g fill="#f7c95f"><circle cx="33" cy="78" r="7"/><circle cx="73" cy="20" r="7"/><circle cx="113" cy="72" r="7"/></g><g fill="#8bb57d"><ellipse cx="45" cy="72" rx="10" ry="5" transform="rotate(-35 45 72)"/><ellipse cx="100" cy="65" rx="10" ry="5" transform="rotate(35 100 65)"/></g></svg>`}
function gardenShedSvg(){return`<svg viewBox="0 0 150 135" aria-hidden="true"><path d="M20 57h110v68H20z" fill="#fff8ea" stroke="#d8c8b4" stroke-width="4"/><path d="M10 59L75 18l65 41z" fill="#c87855" stroke="#aa6448" stroke-width="4"/><rect x="62" y="75" width="30" height="50" rx="4" fill="#7f9f87"/><rect x="31" y="72" width="22" height="22" rx="4" fill="#b9d8e7" stroke="#fff" stroke-width="4"/><path d="M42 72v22M31 83h22" stroke="#fff" stroke-width="3"/><circle cx="85" cy="99" r="3" fill="#f2cc5b"/><rect x="103" y="74" width="12" height="35" rx="5" fill="#c99a63"/><path d="M109 72l9-18M109 72l-9-18" stroke="#7c8f67" stroke-width="5" stroke-linecap="round"/></svg>`}
'''
          if marker not in s: raise SystemExit('gardenObjectArt marker missing')
          s=s.replace(marker,art+marker,1)

          old_art="function gardenObjectArt(r){if(r.id==='bunny')return rabbitSvg();if(r.id==='bench')return benchSvg();if(r.id==='picnic')return picnicSvg();if(r.id==='mail')return mailboxSvg();if(r.id==='cat')return catSvg();return r.icon||'✦'}"
          new_art="function gardenObjectArt(r){if(r.id==='bunny')return rabbitSvg();if(r.id==='bench')return caBenchSvg();if(r.id==='picnic')return caPicnicSvg();if(r.id==='mail')return caMailboxSvg();if(r.id==='cat')return caCatSvg();if(r.id==='birdbath')return birdBathSvg();if(r.id==='seedcrate')return seedCrateSvg();if(r.id==='arch')return flowerArchSvg();if(r.id==='shed')return gardenShedSvg();return r.icon||'✦'}"
          if old_art not in s: raise SystemExit('gardenObjectArt target missing')
          s=s.replace(old_art,new_art,1)

          old_react="const data={seat:['bench','♡','Cozy!'],picnic:['picnic','🍓','Snack time!'],mail:['mail','💌','A letter!'],friends:['cat','♡','New friend!']}[type];"
          new_react="const data={seat:['bench','♡','Cozy!'],picnic:['picnic','🍓','Snack time!'],mail:['mail','💌','A letter!'],friends:['cat','♡','New friend!'],birds:['birdbath','🐦','Bird visitors!'],seeds:['seedcrate','🌼','Planting time!'],arch:['arch','✦','Pretty!'],shed:['shed','🧤','Garden tools!']}[type];"
          if old_react not in s: raise SystemExit('reaction data target missing')
          s=s.replace(old_react,new_react,1)

          old_options="const options=[['bench','seat',16],['picnic','picnic',17],['mail','mail',17],['cat','friends',16]].filter(([key])=>gardenUnlocked(key));"
          new_options="const options=[['bench','seat',16],['picnic','picnic',17],['mail','mail',17],['cat','friends',16],['birdbath','birds',16],['seedcrate','seeds',16],['arch','arch',18],['shed','shed',17]].filter(([key])=>gardenUnlocked(key));"
          if old_options not in s: raise SystemExit('drop options target missing')
          s=s.replace(old_options,new_options,1)

          old_tail="""  if(id==='mail'&&gardenUnlocked('mail')&&gardenDistance(p,bp)<17){releaseBunnyHere(bp);triggerGardenInteraction('mail','bunny');return true}
  if(id==='cat'&&gardenUnlocked('cat')&&gardenDistance(p,bp)<16){triggerGardenInteraction('friends','bunny');return true}
  return false
}"""
          new_tail="""  if(id==='mail'&&gardenUnlocked('mail')&&gardenDistance(p,bp)<17){releaseBunnyHere(bp);triggerGardenInteraction('mail','bunny');return true}
  if(id==='cat'&&gardenUnlocked('cat')&&gardenDistance(p,bp)<16){triggerGardenInteraction('friends','bunny');return true}
  if(id==='birdbath'&&gardenUnlocked('birdbath')&&gardenDistance(p,bp)<16){triggerGardenInteraction('birds','bunny');return true}
  if(id==='seedcrate'&&gardenUnlocked('seedcrate')&&gardenDistance(p,bp)<16){triggerGardenInteraction('seeds','bunny');return true}
  if(id==='arch'&&gardenUnlocked('arch')&&gardenDistance(p,bp)<18){triggerGardenInteraction('arch','bunny');return true}
  if(id==='shed'&&gardenUnlocked('shed')&&gardenDistance(p,bp)<17){triggerGardenInteraction('shed','bunny');return true}
  return false
}"""
          if old_tail not in s: raise SystemExit('drop reaction tail missing')
          s=s.replace(old_tail,new_tail,1)

          old_taps="""function tapGardenObject(id){
  if(id==='picnic'){triggerGardenInteraction('picnic',id);renderGarden();return}
  if(id==='mail'){triggerGardenInteraction('mail',id);renderGarden();return}
  if(id==='cat'){triggerGardenInteraction('friends',id);renderGarden();return}
  if(id==='bench'&&state.garden.bunnySeated){triggerGardenInteraction('seat','bunny');renderGarden()}
}"""
          new_taps="""function tapGardenObject(id){
  if(id==='picnic'){triggerGardenInteraction('picnic',id);renderGarden();return}
  if(id==='mail'){triggerGardenInteraction('mail',id);renderGarden();return}
  if(id==='cat'){triggerGardenInteraction('friends',id);renderGarden();return}
  if(id==='birdbath'){triggerGardenInteraction('birds',id);renderGarden();return}
  if(id==='seedcrate'){triggerGardenInteraction('seeds',id);renderGarden();return}
  if(id==='arch'){triggerGardenInteraction('arch',id);renderGarden();return}
  if(id==='shed'){triggerGardenInteraction('shed',id);renderGarden();return}
  if(id==='bench'&&state.garden.bunnySeated){triggerGardenInteraction('seat','bunny');renderGarden()}
}"""
          if old_taps not in s: raise SystemExit('tap function missing')
          s=s.replace(old_taps,new_taps,1)

          old_decor='<div class="garden-butterfly b2">🦋</div><div class="sun"></div><div class="cloud a"></div><div class="cloud b"></div><div class="hill back"></div><div class="hill front"></div><div class="path"></div><div class="pond"></div>'
          new_decor='<div class="garden-butterfly b2">🦋</div><div class="sun"></div><div class="cloud a"></div><div class="cloud b"></div><div class="hill back"></div><div class="hill front"></div><div class="ca-house"></div><div class="white-fence"></div><div class="citrus-tree"></div><div class="patio-lights"></div><div class="lavender-edge left"></div><div class="lavender-edge right"></div><div class="path"></div><div class="pond"></div>'
          if old_decor not in s: raise SystemExit('garden decor target missing')
          s=s.replace(old_decor,new_decor,1)

          s=s.replace('Interactive treasures · visible plant growth · softer sound','Sunny backyard edition · collect, decorate, and grow')
          s=s.replace("'Drag Bunny to the bench, picnic, mailbox, or cat — each one reacts differently.'","'Drag Bunny around the backyard — every special spot has its own little reaction.'")

          p.write_text(s)

          css=Path('california-backyard-v5.css')
          css.write_text(r'''/* CALIFORNIA_BACKYARD_V5_20260914 */
.garden-scene{background:linear-gradient(180deg,#74c9f4 0%,#a9ddf5 31%,#dceee3 44%,#8fbd78 44.2%,#72a866 100%);box-shadow:0 22px 54px #39586a24,inset 0 0 0 1px #ffffffc4}
.garden-scene:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 84% 9%,#fff8c7a8 0 5%,#fff3b34a 10%,transparent 25%),linear-gradient(180deg,#ffffff10,transparent 54%);z-index:1}
.sun{right:7%;top:5%;width:104px;height:104px;background:radial-gradient(circle,#fffce2 0 27%,#ffe995 44%,#ffd66c55 61%,transparent 72%);filter:blur(.1px)}
.cloud{background:#fffdf2d9;box-shadow:0 5px 18px #4a849817}.cloud.a{left:10%;top:10%;transform:scale(1.08)}.cloud.b{right:31%;top:18%;transform:scale(.64)}
.hill.back{top:34%;height:24%;background:#9ac38f}.hill.front{top:41%;height:26%;background:#7fb474}
.ca-house{position:absolute;z-index:3;right:5%;top:24%;width:185px;height:116px;border-radius:8px 8px 2px 2px;background:#fff5df;box-shadow:0 12px 25px #42623f24;border:3px solid #ead9bd}
.ca-house:before{content:"";position:absolute;left:-16px;right:-16px;top:-46px;height:58px;background:#c77555;clip-path:polygon(50% 0,100% 78%,91% 100%,9% 100%,0 78%);filter:drop-shadow(0 5px 3px #72472f24)}
.ca-house:after{content:"";position:absolute;left:24px;top:31px;width:37px;height:38px;border:5px solid #fff;background:linear-gradient(90deg,transparent 45%,#fff 46% 54%,transparent 55%),linear-gradient(0deg,transparent 45%,#fff 46% 54%,transparent 55%),#a9d7ea;box-shadow:84px 3px 0 -1px #a9d7ea,84px 3px 0 4px #fff}
.white-fence{position:absolute;z-index:5;left:-2%;right:-2%;top:42%;height:116px;background:linear-gradient(#fff9ea 0 8px,transparent 8px 43px,#fff9ea 43px 53px,transparent 53px),repeating-linear-gradient(90deg,#fffdf2 0 13px,transparent 13px 20px);filter:drop-shadow(0 6px 5px #47634622);opacity:.98}
.white-fence:after{content:"";position:absolute;inset:-11px 0 auto 0;height:22px;background:repeating-linear-gradient(90deg,#fffdf2 0 13px,transparent 13px 20px);clip-path:polygon(0 100%,50% 0,100% 100%)}
.citrus-tree{position:absolute;z-index:6;left:4%;top:21%;width:154px;height:215px;filter:drop-shadow(0 13px 9px #324d2b21)}
.citrus-tree:before{content:"";position:absolute;left:68px;bottom:0;width:18px;height:105px;border-radius:14px;background:#9b6b46;transform:rotate(-4deg)}
.citrus-tree:after{content:"";position:absolute;left:4px;top:0;width:144px;height:128px;border-radius:48% 52% 49% 51%;background:radial-gradient(circle at 24% 34%,#ffd15a 0 6px,transparent 7px),radial-gradient(circle at 72% 28%,#f3c247 0 6px,transparent 7px),radial-gradient(circle at 59% 72%,#ffd45d 0 7px,transparent 8px),radial-gradient(circle at 34% 67%,#f5c64e 0 6px,transparent 7px),radial-gradient(circle at 52% 45%,#78ad65 0 18%,transparent 19%),radial-gradient(circle at 31% 39%,#6fa65e 0 25%,transparent 26%),radial-gradient(circle at 70% 43%,#79ae67 0 29%,transparent 30%),#7cae67}
.patio-lights{position:absolute;z-index:7;left:16%;right:18%;top:15%;height:48px;border-top:2px solid #8d74586e;border-radius:50%;pointer-events:none}
.patio-lights:after{content:"•  •  •  •  •  •  •";position:absolute;left:4%;right:4%;top:-11px;color:#ffd66d;font-size:28px;letter-spacing:3.2vw;text-shadow:0 0 8px #fff1a8}
.lavender-edge{position:absolute;z-index:6;bottom:7%;width:18%;height:19%;opacity:.95;background:radial-gradient(ellipse at 15% 70%,#8d6db1 0 4px,transparent 5px),radial-gradient(ellipse at 30% 45%,#9471b6 0 5px,transparent 6px),radial-gradient(ellipse at 47% 66%,#8363a6 0 4px,transparent 5px),radial-gradient(ellipse at 63% 40%,#9877bd 0 5px,transparent 6px),radial-gradient(ellipse at 80% 69%,#8665aa 0 5px,transparent 6px);filter:drop-shadow(0 7px 7px #4b5a3b1e)}
.lavender-edge.left{left:1%}.lavender-edge.right{right:1%;transform:scaleX(-1)}
.path{z-index:4;left:47%;top:49%;width:16%;height:55%;background:linear-gradient(90deg,#e8cfab,#f2dfbd 48%,#e6c89f);clip-path:polygon(38% 0,62% 0,88% 100%,7% 100%);opacity:.98;filter:drop-shadow(0 7px 8px #65513c20)}
.pond{display:none}
.plot{z-index:8;bottom:10%;height:17%;border-radius:16px 16px 24px 24px/13px 13px 24px 24px;background:linear-gradient(#724b32,#59351f);border:9px solid #c9915f;box-shadow:0 10px 0 #9f6b43,0 18px 22px #3d4f302b,inset 0 5px 10px #2e211b55}
.plot.left{left:11%}.plot.right{left:39%}
.plot:before{content:"";position:absolute;left:7px;right:7px;top:-9px;height:8px;border-radius:99px;background:#e1ae79;opacity:.9}
.garden-object{filter:drop-shadow(0 10px 8px #34492d24)}
.garden-object.bench{width:118px;height:92px}.garden-object.picnic{width:119px;height:96px}.garden-object.mail{width:94px;height:111px}.garden-object.cat{width:96px;height:114px}.garden-object.birdbath{width:92px;height:108px}.garden-object.seedcrate{width:110px;height:90px}.garden-object.arch{width:124px;height:130px}.garden-object.shed{width:132px;height:118px}
.garden-object.arch,.garden-object.shed{z-index:7!important}.garden-object.bunny,.garden-object.cat{z-index:18!important}
.next-surprise{background:#fffaf0dd!important;border:1px solid #ffffffcc;color:#5f654f!important;box-shadow:0 8px 18px #4255381c!important}
.garden-update{background:#315c447d!important;color:#fff!important;backdrop-filter:blur(8px);border:1px solid #ffffff4d!important}.garden-update b{color:#ffe77f!important}
.garden-tip{background:#fffaf1ed;color:#656451;box-shadow:0 8px 20px #3e51321e;border:1px solid #ffffffc9}
.garden-reaction.birds span{animation:reactionFloat 1.8s ease both}.garden-reaction.seeds span{animation:snackPop .75s ease both}.garden-reaction.arch span{animation:heartBeat .65s ease 2}.garden-reaction.shed span{animation:reactionFloat 1.8s ease both}
.treasure-art .garden-object{position:static;transform:none}
@media(max-width:900px){.ca-house{right:3%;width:155px;height:100px}.citrus-tree{left:1%;transform:scale(.86);transform-origin:bottom left}.white-fence{top:43%}.garden-object.arch{width:108px;height:115px}.garden-object.shed{width:116px;height:104px}}
@media(max-width:700px){.ca-house{opacity:.8;right:-1%;transform:scale(.78);transform-origin:top right}.citrus-tree{transform:scale(.68);top:27%}.patio-lights{display:none}.lavender-edge{opacity:.7}.garden-object.birdbath{width:72px;height:86px}.garden-object.seedcrate{width:88px;height:72px}.garden-object.arch{width:92px;height:102px}.garden-object.shed{width:96px;height:86px}}
''')

          idx=Path('index.html')
          h=idx.read_text()
          marker_css='  <link rel="stylesheet" href="garden-admin-v4.css?v=20260914-v4">'
          if marker_css not in h: raise SystemExit('index css marker missing')
          h=h.replace(marker_css,marker_css+'\n  <link rel="stylesheet" href="california-backyard-v5.css?v=20260914-v5">',1)
          h=h.replace('app.js?v=20260914-garden-v4a','app.js?v=20260914-garden-v5')
          idx.write_text(h)
          PY

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html california-backyard-v5.css
          git diff --cached --quiet && exit 0
          git commit -m "Redesign garden as sunny California backyard"
          git push
