name: Enable Pencil scratch erase in Stages 3 and 4

on:
  push:
    paths:
      - '.github/workflows/pencil-scratch-erase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Pencil scratch erase patch
        run: python _pencil_erase_patch.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script missing')
          Path('/tmp/app.js').write_text(m.group(1))
          for x in ['PENCIL_SCRATCH_ERASE_V1_20260913','function bindPencilErase','〰︎〰︎〰︎ → ⌫']:
              if x not in s: raise SystemExit('missing '+x)
          PY
          node --check /tmp/app.js
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Enable Apple Pencil scratch-to-erase in spelling boxes"
          git push
