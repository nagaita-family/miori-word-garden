name: Parent backup controls v33

on:
  push:
    paths:
      - '.github/workflows/backup-controls-v33.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add distinct backup actions and confirmation
        run: python3 tools/backup-controls-v33-patch.py
      - name: Refresh historical versioned asset assertions
        run: python3 tools/backup-controls-v33-testfix.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check tests/backup-controls-v33.test.cjs
      - name: Run entire regression suite
        run: node --test tests/*.test.cjs
      - name: Publish only when all tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/*.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Separate backup import export and guarded restore UI (v33)"
          git push
