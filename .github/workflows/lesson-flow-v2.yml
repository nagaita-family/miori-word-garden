name: Lesson flow v2
on:
  push:
    paths:
      - tools/lesson-flow-v2.py
      - lesson-flow-v2.css
      - .github/workflows/lesson-flow-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lesson flow v2
        run: python tools/lesson-flow-v2.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          grep -q 'LESSON_FLOW_V2_20260914' lesson-flow-v2.css
          grep -q 'Device voice fallback' app.js
          grep -q 'made the garden grow' app.js
          grep -q 'lesson-flow-v2.css' index.html
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html lesson-flow-v2.css
          if git diff --cached --quiet; then
            echo 'No production changes needed.'
          else
            git commit -m 'Speed Pencil flow, harden audio, and animate garden rewards'
            git push origin main
          fi
