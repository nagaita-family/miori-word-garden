name: Learning groups v32

on:
  push:
    paths:
      - '.github/workflows/learning-groups-v32.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate This Week My Words and Past Tests
        run: python3 tools/learning-groups-v32-patch.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check writing-erase-v30.js
          node --check weekly-test-palm-v25.js
          node --check weekly-result-compare-v26.js
      - name: Run complete regression suite
        run: node --test tests/*.test.cjs
      - name: Publish v32 only if all checks pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/*.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Separate This Week, My Words, and Past Tests with 4+1 practice (v32)"
          git push

# rerun after historical regression assertions were updated for week-scoped focus
