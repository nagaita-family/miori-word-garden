name: Import Word Garden ZIP

on:
  push:
    paths:
      - 'miori_word_garden_v*.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded Word Garden ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls -1t miori_word_garden_v*.zip | head -n 1)"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Replace repository contents with ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          ZIP='${{ steps.zip.outputs.zip }}'
          rm -rf .import_tmp
          mkdir .import_tmp
          unzip -q "$ZIP" -d .import_tmp

          # Most release ZIPs contain one top-level folder. If so, use its contents.
          TOP_COUNT="$(find .import_tmp -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          if [ "$TOP_COUNT" = "1" ] && [ -d "$(find .import_tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SRC="$(find .import_tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          else
            SRC=".import_tmp"
          fi

          # Keep git metadata and this workflow; replace the app files cleanly.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.import_tmp' \
            ! -name "$ZIP" \
            -exec rm -rf {} +

          cp -a "$SRC"/. .
          rm -rf .import_tmp
          rm -f "$ZIP"

      - name: Commit imported release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import Word Garden release from ZIP'
          git push
