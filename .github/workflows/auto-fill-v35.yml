name: Verify and release Auto Fill v35
on:
  push:
    paths:
      - '.github/workflows/auto-fill-v35.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare version bump and refresh prior cache assertions
        run: python3 tools/auto-fill-v35-release.py
      - name: Check JavaScript syntax
        run: |
          node --check word-auto-fill-v34.js
          node --check app.js
          node --check tests/word-auto-fill-reliability-v35.test.cjs
      - name: Run complete regression suite including simulated API outages
        run: node --test tests/*.test.cjs
      - name: Release only after all tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html word-auto-fill-v34.js tests/*.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Release robust basic-word Auto Fill and Wiktionary parser (v35)"
          git push
