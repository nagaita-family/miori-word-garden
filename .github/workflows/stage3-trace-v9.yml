name: Stage 3 trace bridge v9

on:
  push:
    paths:
      - '.github/workflows/stage3-trace-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Stage 3 trace bridge
        run: python3 tools/stage3_trace_v9_patch.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Check markers
        run: |
          grep -q "Trace the word. Fill the blank." app.js
          grep -q "function bindTraceBox" app.js
          grep -q "stage3-trace-row" app.js
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add guided tracing bridge to Stage 3"
          git push
