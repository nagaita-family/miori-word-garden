name: Weekly Listen regression v27

on:
  push:
    paths:
      - '.github/workflows/weekly-listen-v27.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare v27 Listen fix release
        run: python3 tools/weekly-listen-v27-patch.py
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check weekly-test-palm-v25.js
          node --check weekly-result-compare-v26.js
      - name: Check previous and new regressions
        run: |
          node tests/parent-priority-v22.test.cjs
          node tests/weekly-test-v23.test.cjs
          node tests/weekly-test-v24.test.cjs
          node tests/weekly-test-v25.test.cjs
          node tests/weekly-result-v26.test.cjs
          node tests/weekly-listen-v27.test.cjs
      - name: Publish tested v27 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/weekly-test-v25.test.cjs tests/weekly-result-v26.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Fix weekly Listen blocked by grading palm guard (v27)"
          git push
