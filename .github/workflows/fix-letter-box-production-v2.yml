name: Run safe letter-box production repair

on:
  push:
    paths:
      - '.github/workflows/fix-letter-box-production-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good app
        run: git show 8efcc6f940bbe78579e8d269367f584bc5f824e9:index.html > index.html
      - name: Apply safe letter-box patch
        run: python _letterbox_v4/patch.py
      - name: Validate JavaScript and structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script missing')
          Path('/tmp/app.js').write_text(m.group(1))
          if "$('#home').onclick=()=>//" in s: raise SystemExit('corrupted home handler')
          for x in ['LETTER_BOX_WRITING_V4_20260913','LETTER BOX MODE','function practiceTarget','function openInlineHint']:
              if x not in s: raise SystemExit('missing '+x)
          PY
          node --check /tmp/app.js
      - name: Commit repaired app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js netlify.toml
          git commit -m "Repair Stage 3 and 4 letter-box writing UI"
          git push
