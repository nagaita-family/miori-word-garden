name: Weekly result comparison v26

on:
  push:
    paths:
      - '.github/workflows/weekly-result-v26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate v26 into weekly result view
        run: python3 tools/weekly-result-v26-patch.py
      - name: Validate scripts
        run: |
          node --check app.js
          node --check weekly-result-compare-v26.js
          node --check weekly-test-palm-v25.js
      - name: Regression tests from v22 to v26
        run: |
          node tests/parent-priority-v22.test.cjs
          node tests/weekly-test-v23.test.cjs
          node tests/weekly-test-v24.test.cjs
          node tests/weekly-test-v25.test.cjs
          node tests/weekly-result-v26.test.cjs
      - name: Commit verified UI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/weekly-test-v24.test.cjs tests/weekly-test-v25.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Show aligned spelling differences after weekly grading"
          git push
