name: Garden delight v3

on:
  push:
    branches: ["main"]
    paths:
      - "_garden_v3/patch.py"
      - ".github/workflows/garden-delight-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply garden delight v3
        run: python _garden_v3/patch.py

      - name: Validate JavaScript and markers
        run: |
          node --check app.js
          grep -q "GARDEN_DELIGHT_V3_20260914" garden-delight-v3.css
          grep -q "Strawberry picnic" app.js
          grep -q "growthJourneyHtml" app.js
          grep -q "Soft garden ambience" app.js

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html garden-delight-v3.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Upgrade garden rewards, interactions, growth, and ambience"
            git push
          fi
