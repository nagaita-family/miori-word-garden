name: Align Scribble erase with letter boxes

on:
  push:
    paths:
      - '.github/workflows/align-scribble-to-boxes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align native Scribble geometry to visual boxes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          marker='SCRIBBLE_BOX_ALIGNMENT_V1_20260913'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          m=re.search(r'\.scribbleCapture\{position:absolute;inset:5px 0;[^}]+\}',s)
          if not m:
              raise SystemExit('scribbleCapture CSS not found')
          new_css='.scribbleCapture{position:absolute;top:5px;left:0;width:100%;height:64px;z-index:3;border:0;outline:0;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:transparent;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:34px;letter-spacing:0;text-align:left;padding:0;border-radius:15px}\n/* SCRIBBLE_BOX_ALIGNMENT_V1_20260913 */'
          s=s[:m.start()]+new_css+s[m.end():]
          a='<span class="lettertile fixed">${w.word[j]}</span>'
          b='<span class="lettertile fixed" data-i="${j}">${w.word[j]}</span>'
          if a not in s:
              raise SystemExit('fixed tile anchor not found')
          s=s.replace(a,b,1)
          a='<span class="lettertile ${cls.trim()}">${esc(shown)}</span>'
          b='<span class="lettertile ${cls.trim()}" data-i="${j}">${esc(shown)}</span>'
          if a not in s:
              raise SystemExit('writable tile anchor not found')
          s=s.replace(a,b,1)
          anchor='function refreshTiles(w,q){'
          if anchor not in s:
              raise SystemExit('refresh anchor not found')
          helper="function syncScribbleGeometry(w,q,i){let box=$('#tileword'),wrap=i?.closest('.spellinput');if(!box||!wrap||!i)return;let p=practiceTarget(w,q),tiles=[...box.querySelectorAll('.lettertile')],first=tiles[p.start],last=tiles[p.end-1];if(!first||!last)return;let wr=wrap.getBoundingClientRect(),fr=first.getBoundingClientRect(),lr=last.getBoundingClientRect(),step=fr.width;if(p.text.length>1&&tiles[p.start+1])step=tiles[p.start+1].getBoundingClientRect().left-fr.left;let font=Math.max(22,Math.min(36,fr.width*.68)),glyph=font*.61,pad=Math.max(0,(fr.width-glyph)/2),spacing=Math.max(0,step-glyph);i.style.left=(fr.left-wr.left)+'px';i.style.top=(fr.top-wr.top)+'px';i.style.width=(lr.right-fr.left)+'px';i.style.height=fr.height+'px';i.style.fontSize=font+'px';i.style.letterSpacing=spacing+'px';i.style.paddingLeft=pad+'px';i.style.paddingRight='0px';i.style.textAlign='left'}\n"
          s=s.replace(anchor,helper+anchor,1)
          old="function refreshTiles(w,q){let t=$('#tileword');if(t)t.innerHTML=writingTiles(w,q)}"
          new="function refreshTiles(w,q){let t=$('#tileword');if(t)t.innerHTML=writingTiles(w,q);let i=$('#write');if(i)requestAnimationFrame(()=>syncScribbleGeometry(w,q,i))}"
          if old not in s:
              raise SystemExit('refresh body not found')
          s=s.replace(old,new,1)
          old="bindPencilErase(w,q,i)}$('#check')"
          new="bindPencilErase(w,q,i);syncScribbleGeometry(w,q,i);requestAnimationFrame(()=>syncScribbleGeometry(w,q,i))}$('#check')"
          if old not in s:
              raise SystemExit('bindPlay anchor not found')
          s=s.replace(old,new,1)
          s=s.replace('✎ Scratch a letter to erase','✎ Scratch the letter box to erase',1)
          p.write_text(s)
          sw=Path('sw.js')
          sws=sw.read_text()
          sws=re.sub(r"const CACHE='[^']+';","const CACHE='mwg-v2-scribble-box-align-20260913';",sws,count=1)
          sw.write_text(sws)
          PY
      - name: Validate JavaScript and patch markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('script missing')
          Path('/tmp/app.js').write_text(m.group(1))
          for x in ['SCRIBBLE_BOX_ALIGNMENT_V1_20260913','function syncScribbleGeometry','data-i="${j}"','Scratch the letter box to erase']:
              if x not in s:
                  raise SystemExit('missing '+x)
          PY
          node --check /tmp/app.js
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Align Apple Pencil Scribble erase with individual boxes"
          git push
