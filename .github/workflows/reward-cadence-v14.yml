name: Reward cadence v14

on:
  push:
    paths:
      - '.github/workflows/reward-cadence-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply 3-word reward cadence
        run: python3 tools/reward-cadence-v14.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Check reward thresholds
        run: |
          grep -q "id:'bench',xp:90" app.js
          grep -q "id:'shed',xp:720" app.js
          grep -q "wordsAway" app.js
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Set garden rewards to every three words"
          git push
