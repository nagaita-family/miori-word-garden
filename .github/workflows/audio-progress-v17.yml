name: Audio and progress v17

on:
  push:
    paths:
      - '.github/workflows/audio-progress-v17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply audio and treasure progress update
        run: python3 tools/audio-progress-v17.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Check v17 markers
        run: |
          grep -q "function treasureProgress" app.js
          grep -q "audioDefaultV17" app.js
          grep -q "Collection complete" app.js
          grep -q "function startFilledBoxScratch" app.js
          grep -q "currentView==='play'" app.js
          grep -q "playSfx('store')" app.js
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add default-on audio feedback and treasure meter"
          git push
