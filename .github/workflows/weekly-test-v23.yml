name: Install This Week Test v23

on:
  push:
    paths:
      - '.github/workflows/weekly-test-v23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply weekly spelling test
        run: python3 tools/weekly-test-v23.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Test assessment logic and safety regressions
        run: node tests/weekly-test-v23.test.cjs
      - name: Commit tested app code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add This Week Test answer sheet and missed-word review"
          git push
