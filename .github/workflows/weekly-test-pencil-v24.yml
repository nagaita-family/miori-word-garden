name: Weekly test grading and Pencil fix v24

on:
  push:
    paths:
      - '.github/workflows/weekly-test-pencil-v24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v24 weekly test UI fixes
        run: python3 tools/weekly-test-pencil-v24.py
      - name: Make old regression accept newer visible versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/weekly-test-v23.test.cjs')
          old="assert(index.includes('v23 · Sep 17'),'Visible version updated');"
          new='assert.match(index,/class="app-version-badge"[^>]*>v[0-9]+ · /,"Visible version badge exists");'
          s=p.read_text(encoding='utf-8')
          assert s.count(old)==1, 'Expected exact historical version assertion'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check earlier weekly and parent practice regressions
        run: |
          node tests/weekly-test-v23.test.cjs
          node tests/parent-priority-v22.test.cjs
      - name: Check grading visibility and Pencil answer behavior
        run: node tests/weekly-test-v24.test.cjs
      - name: Commit checked implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/weekly-test-v23.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Keep weekly test grading visible and normalize Pencil answers"
          git push
