name: Weekly test grading and Pencil fix v24

on:
  push:
    paths:
      - '.github/workflows/weekly-test-pencil-v24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v24 weekly test UI fixes
        run: python3 tools/weekly-test-pencil-v24.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check earlier weekly and parent practice regressions
        run: |
          node tests/weekly-test-v23.test.cjs
          node tests/parent-priority-v22.test.cjs
      - name: Check grading visibility and Pencil answer behavior
        run: node tests/weekly-test-v24.test.cjs
      - name: Commit checked implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep weekly test grading visible and normalize Pencil answers"
          git push
