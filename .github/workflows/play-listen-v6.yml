name: Play listen cues v6

on:
  push:
    paths:
      - '.github/workflows/play-listen-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Play listen-first cue update
        run: python3 tools/play_listen_patch.py

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit production app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Make Play cues listen-first and larger"
          git push
