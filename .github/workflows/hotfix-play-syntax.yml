name: Hotfix Play syntax

on:
  push:
    paths:
      - '.github/workflows/hotfix-play-syntax.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix picture cue URL test and final reward transition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          start=s.index('function wordPic(')
          end=s.index('\nfunction newQ',start)
          block=s[start:end]
          new_test="url=raw.startsWith('http://')||raw.startsWith('https://')||raw.startsWith('data:image/');return"
          block2,n=re.subn(r'url=.*?;return',new_test,block,count=1)
          if n!=1:
              raise SystemExit('Could not replace picture URL test')
          s=s[:start]+block2+s[end:]

          old2='save();playView();xp(gain);let up='
          if old2 in s:
              s=s.replace(old2,'save();xp(gain);let up=',1)

          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Validate Play loop and smooth word reward transition"
          git push
