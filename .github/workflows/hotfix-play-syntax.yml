name: Hotfix Play syntax

on:
  push:
    paths:
      - '.github/workflows/hotfix-play-syntax.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax and final reward transition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=r"url=/^(https?:\\/\\/|data:image\\/)/i.test(raw);"
          new="url=raw.startsWith('http://')||raw.startsWith('https://')||raw.startsWith('data:image/');"
          if old not in s:
              raise SystemExit('Expected picture URL test not found')
          s=s.replace(old,new,1)
          old2="save();playView();xp(gain);let up="
          if old2 not in s:
              raise SystemExit('Expected final-stage transition not found')
          s=s.replace(old2,"save();xp(gain);let up=",1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Play picture cue syntax and reward transition"
          git push
