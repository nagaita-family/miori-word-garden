name: Repair Pencil scratch erase V2

on:
  push:
    paths:
      - '.github/workflows/pencil-scratch-erase-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch robust Pencil erase handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          marker='PENCIL_SCRATCH_ERASE_V2_20260913'
          if marker in s:
              print('already patched')
              raise SystemExit(0)

          s=s.replace('/* PENCIL_SCRATCH_ERASE_V1_20260913 */','/* PENCIL_SCRATCH_ERASE_V2_20260913 */',1)
          s=s.replace('✎ 〰︎〰︎〰︎ → ⌫','✎ Scratch a letter to erase',1)

          new_func=r'''function bindPencilErase(w,q,i){let box=$('#tileword'),surface=i?.closest('.spellinput')||i;if(!box||!i||!surface)return;let stroke=null;const add=e=>{if(!stroke)return;let es=e.getCoalescedEvents?.()||[e];for(let x of es)if(Number.isFinite(x.clientX)&&Number.isFinite(x.clientY))stroke.pts.push({x:x.clientX,y:x.clientY,t:performance.now()})};const cleanup=()=>{window.removeEventListener('pointermove',move,true);window.removeEventListener('pointerup',finish,true);window.removeEventListener('pointercancel',finish,true)};const move=e=>{if(!stroke||e.pointerId!==stroke.id||e.pointerType!=='pen')return;add(e)};const finish=e=>{if(!stroke||e.pointerId!==stroke.id)return;add(e);let st=stroke;stroke=null;cleanup();let p=practiceTarget(w,q);setTimeout(()=>{let nativeNow=norm(i.value);if(nativeNow!==st.before){q.answer=nativeNow.slice(0,p.text.length);q.feedback=null;q.hint=null;refreshTiles(w,q);return}let pts=st.pts;if(!st.before||pts.length<2)return;let xs=pts.map(x=>x.x),ys=pts.map(x=>x.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),width=maxX-minX,height=maxY-minY,duration=pts[pts.length-1].t-pts[0].t,path=0,reversals=0,lastDir=0;for(let n=1;n<pts.length;n++){let dx=pts[n].x-pts[n-1].x,dy=pts[n].y-pts[n-1].y;path+=Math.hypot(dx,dy);if(Math.abs(dx)>=2){let dir=Math.sign(dx);if(lastDir&&dir!==lastDir)reversals++;lastDir=dir}}let tiles=[...box.querySelectorAll('.lettertile')],tileW=tiles[0]?.getBoundingClientRect().width||48,tileH=tiles[0]?.getBoundingClientRect().height||58;let scratch=duration<2200&&width>=Math.max(10,tileW*.16)&&height<=tileH*1.9&&path>=Math.max(18,tileW*.38)&&(reversals>=1||path>=Math.max(32,width*1.65));if(!scratch)return;let cx=(minX+maxX)/2,full=-1,best=1e9;tiles.forEach((t,n)=>{let r=t.getBoundingClientRect(),d=Math.abs(cx-(r.left+r.right)/2);if(d<best){best=d;full=n}});if(full<0)return;let rel=full-p.start;if(q.stage===3&&(full<p.start||full>=p.end))return;if(rel<0||rel>=p.text.length)return;let a=alignChars(p.text,st.before),slot=a.slots[rel],typedIndex=slot?.typedIndex;if(typedIndex==null)return;let chars=[...st.before];chars.splice(typedIndex,1);q.answer=chars.join('').slice(0,p.text.length);i.value=q.answer;q.feedback=null;q.hint=null;refreshTiles(w,q);let fresh=[...box.querySelectorAll('.lettertile')][full];if(fresh){fresh.classList.remove('eraseflash');void fresh.offsetWidth;fresh.classList.add('eraseflash')}if(navigator.vibrate)navigator.vibrate(8)},140)};surface.addEventListener('pointerdown',e=>{if(e.pointerType!=='pen')return;let r=box.getBoundingClientRect();if(e.clientX<r.left-10||e.clientX>r.right+10||e.clientY<r.top-14||e.clientY>r.bottom+14)return;cleanup();stroke={id:e.pointerId,pts:[],before:norm(i.value||q.answer)};add(e);window.addEventListener('pointermove',move,true);window.addEventListener('pointerup',finish,true);window.addEventListener('pointercancel',finish,true)},true)}'''

          pat=r"function bindPencilErase\(w,q,i\)\{.*?\}\nfunction bindPlay"
          if not re.search(pat,s,re.S):
              raise SystemExit('bindPencilErase block not found')
          s=re.sub(pat,new_func+'\nfunction bindPlay',s,count=1,flags=re.S)
          p.write_text(s)

          sw=Path('sw.js')
          sws=sw.read_text()
          sws=re.sub(r"const CACHE='[^']+';","const CACHE='mwg-v2-pencil-erase-v2-20260913';",sws,count=1)
          sw.write_text(sws)
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script missing')
          Path('/tmp/app.js').write_text(m.group(1))
          for x in ['PENCIL_SCRATCH_ERASE_V2_20260913','pointercancel',"i?.closest('.spellinput')",'alignChars(p.text,st.before)','Scratch a letter to erase']:
              if x not in s: raise SystemExit('missing '+x)
          PY
          node --check /tmp/app.js
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Fix Apple Pencil scratch erase on spelling boxes"
          git push
