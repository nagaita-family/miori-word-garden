name: Play handwriting audio v8

on:
  push:
    paths:
      - '.github/workflows/play-handwriting-audio-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v8 handwriting and human audio reliability patch
        run: python3 tools/play_handwriting_audio_v8_patch.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Check markers
        run: |
          grep -q "normalizeScribbleLetter" app.js
          grep -q "Human audio unavailable now" app.js
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Improve Scribble recognition and preserve human audio"
          git push
