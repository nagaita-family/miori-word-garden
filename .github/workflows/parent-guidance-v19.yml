name: Parent guidance v19

on:
  push:
    paths:
      - '.github/workflows/parent-guidance-v19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply parent guidance update
        run: python3 tools/parent-guidance-v19.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Check v19 markers
        run: |
          grep -q "function masteryInfo" app.js
          grep -q "How did that feel" app.js
          grep -q "recentWords" app.js
          grep -q "Parent · Gentle Support" app.js
          grep -q "Needs a little help" app.js
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add gentle parent guidance and mastery view"
          git push
