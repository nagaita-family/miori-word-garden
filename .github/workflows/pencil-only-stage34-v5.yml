name: Stabilize Pencil-only Stage 3 and 4

on:
  push:
    paths:
      - '.github/workflows/pencil-only-stage34-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Pencil-only patch
        run: python _pencil_v5/patch.py
      - name: Validate JavaScript and behavior markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('script missing')
          Path('/tmp/app.js').write_text(m.group(1))
          required=['PENCIL_ONLY_STAGE34_V5_20260913','function bindPencilOnly','inputmode="none"','virtualkeyboardpolicy="manual"','touch-action:none','pencilonly stage${q.stage}','bindPencilOnly(w,q,i);bindPencilErase(w,q,i)']
          for x in required:
              if x not in s:
                  raise SystemExit('missing '+x)
          PY
          node --check /tmp/app.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Stabilize Stage 3 and 4 for Apple Pencil only"
          git push
