name: v32 past-week backfill

on:
  push:
    paths:
      - '.github/workflows/v32-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover pre-v32 Unit 5A history when current week already moved on
        run: python3 tools/v32-backfill-first-past.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run complete regression suite
        run: node --test tests/*.test.cjs
      - name: Publish migration follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/*.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Backfill Unit 5A into Past Tests on upgraded devices (v32)"
          git push
