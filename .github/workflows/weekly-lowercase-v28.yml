name: Weekly lowercase answers v28

on:
  push:
    paths:
      - '.github/workflows/weekly-lowercase-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize weekly exam answers only
        run: python3 tools/weekly-lowercase-v28-patch.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check weekly-test-palm-v25.js
          node --check weekly-result-compare-v26.js
      - name: Verify old behavior and v28 lowercase handwriting
        run: |
          node tests/parent-priority-v22.test.cjs
          node tests/weekly-test-v23.test.cjs
          node tests/weekly-test-v24.test.cjs
          node tests/weekly-test-v25.test.cjs
          node tests/weekly-result-v26.test.cjs
          node tests/weekly-listen-v27.test.cjs
          node tests/weekly-lowercase-v28.test.cjs
      - name: Publish verified v28 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/weekly-test-v24.test.cjs tests/weekly-test-v25.test.cjs tests/weekly-listen-v27.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Normalize weekly handwriting to lowercase letters and fix 1-to-l recognition (v28)"
          git push
