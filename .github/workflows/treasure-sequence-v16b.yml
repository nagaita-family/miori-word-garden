name: Treasure sequence v16b

on:
  push:
    paths:
      - '.github/workflows/treasure-sequence-v16b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply treasure sequence timing
        run: python3 tools/treasure-sequence-v16b.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Sequence plant growth before treasure reveal"
          git push
