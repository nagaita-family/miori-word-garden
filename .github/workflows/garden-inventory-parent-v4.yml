name: Garden inventory and parent v4

on:
  push:
    paths:
      - '.github/workflows/garden-inventory-parent-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply app patch
        run: python3 scripts/garden_admin_v4_patch.py
      - name: Generate PNG app icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          rsvg-convert -w 180 -h 180 app-icon.svg > apple-touch-icon.png
          rsvg-convert -w 192 -h 192 app-icon.svg > icon-192.png
          rsvg-convert -w 512 -h 512 app-icon.svg > icon-512.png
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html apple-touch-icon.png icon-192.png icon-512.png
          git commit -m "Add app icon, Treasure Box, and Parent maintenance UI"
          git push
